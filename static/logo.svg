<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Grupo Linuxero del Bajío</title>
  <defs>
    <!-- aro plateado: metal pulido, brillo en la diagonal superior derecha / inferior izquierda -->
    <linearGradient id="grad-anillo" x1="78" y1="150" x2="433" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9da19e"/>
      <stop offset=".13" stop-color="#b2b6b3"/>
      <stop offset=".25" stop-color="#e0e2df"/>
      <stop offset=".37" stop-color="#f6f7f5"/>
      <stop offset=".5" stop-color="#fdfdfc"/>
      <stop offset=".63" stop-color="#f6f7f5"/>
      <stop offset=".75" stop-color="#e0e2df"/>
      <stop offset=".87" stop-color="#b2b6b3"/>
      <stop offset="1" stop-color="#9da19e"/>
    </linearGradient>
    <!-- esfera verde: luz principal arriba a la izquierda -->
    <radialGradient id="grad-esfera" cx="200" cy="155" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74bb9e"/>
      <stop offset=".25" stop-color="#5aa88b"/>
      <stop offset=".45" stop-color="#33886b"/>
      <stop offset=".62" stop-color="#15694c"/>
      <stop offset=".78" stop-color="#0a5239"/>
      <stop offset=".9" stop-color="#054733"/>
      <stop offset="1" stop-color="#034130"/>
    </radialGradient>
    <!-- reflejo inferior derecho -->
    <radialGradient id="grad-brillo" cx="315" cy="395" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7e4dc" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#a0b9ac" stop-opacity=".5"/>
      <stop offset=".8" stop-color="#5a8270" stop-opacity=".15"/>
      <stop offset="1" stop-color="#3d6b58" stop-opacity="0"/>
    </radialGradient>
    <!-- banda blanca con sombra de la rana a la derecha -->
    <linearGradient id="grad-banda" x1="50" y1="0" x2="462" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".78" stop-color="#ffffff"/>
      <stop offset=".822" stop-color="#a6a6a4"/>
      <stop offset=".86" stop-color="#bcbcba"/>
      <stop offset=".896" stop-color="#d4d4d2"/>
      <stop offset=".932" stop-color="#e8e8e6"/>
      <stop offset=".965" stop-color="#fafaf8"/>
      <stop offset="1" stop-color="#e6e6e4"/>
    </linearGradient>
    <clipPath id="recorte-esfera"><circle cx="255.5" cy="253" r="194"/></clipPath>
  </defs>
  <!-- base blanca del emblema -->
  <circle id="fondo" cx="255.5" cy="253" r="254.3" fill="#fefefe"/>
  <!-- aro plateado -->
  <g id="anillo">
    <circle cx="255.5" cy="253" r="205.5" fill="none" stroke="url(#grad-anillo)" stroke-width="21.5"/>
    <circle cx="255.5" cy="253" r="194.8" fill="none" stroke="#2f5c4a" stroke-width="1.8" stroke-opacity=".45"/>
    <circle cx="255.5" cy="253" r="217.2" fill="none" stroke="#8e938f" stroke-width="2.6" stroke-opacity=".18"/>
  </g>
  <!-- esfera verde -->
  <g id="esfera">
    <circle cx="255.5" cy="253" r="194" fill="url(#grad-esfera)"/>
    <circle cx="255.5" cy="253" r="194" fill="url(#grad-brillo)"/>
  </g>
  <!-- banda blanca -->
  <g id="banda" clip-path="url(#recorte-esfera)">
    <rect x="50" y="208" width="412" height="80" fill="url(#grad-banda)"/>
  </g>
